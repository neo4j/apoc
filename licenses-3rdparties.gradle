// Dependency license reporting
downloadLicenses {
  dependencyConfiguration = 'runtimeClasspath'
  // Add licenses to some libraries which don't declare their license inside the POM. Should be rechecked if the version is updated.
  licenses = [
    'javax.servlet.jsp:jsp-api:2.1' : license('Common Development and Distribution License Version 1.1', null),
    'org.jline:jline:3.22.0' : license('BSD-2-Clause', 'http://opensource.org/licenses/BSD-2-Clause'),
    'com.sun.codemodel:codemodel:2.6' : license('Common Development and Distribution License Version 1.1', null),
  ]
  aliases = allowList.collectEntries { lic ->
    def actual = license(lic.name, lic.url)
    def alternatives = lic.aliases.collect { it.url ? license(it.name, it.url) : it.name }
    [(actual): alternatives]
  }
}

// Set the report destinations explicitly. The plugin's defaults derive from
// ReportingExtension.getBaseDir(), which is deprecated for removal in Gradle 9.0.
tasks.downloadLicenses.configure {
  def licenseReportDir = layout.buildDirectory.dir('reports/license').get().asFile
  jsonDestination = licenseReportDir
  htmlDestination = licenseReportDir
  xmlDestination = licenseReportDir
  // The plugin doesn't track resolved dependencies, so a version bump would otherwise reuse a stale report.
  outputs.upToDateWhen { false }
}

tasks.downloadLicenses.ext.licenseToDependencyJson = {
  ->
  def jsonDir = tasks.downloadLicenses.jsonDestination
  def jsonFile = file("$jsonDir/license-dependency.json")
  new groovy.json.JsonSlurper().parseText(jsonFile.text)
}

tasks.downloadLicenses.ext.dependencyToLicenseJson = {
  ->
  def jsonDir = tasks.downloadLicenses.jsonDestination
  def jsonFile = file("$jsonDir/dependency-license.json")
  new groovy.json.JsonSlurper().parseText(jsonFile.text)
}

// Dependency license validation
tasks.register("validateLicenses") {
  group = 'license'
  description = 'Checks 3rd-party dependency licenses against an allowlist'

  dependsOn tasks.downloadLicenses

  var excludeNeo4jPattern = /^(org|com)\.neo4j.*/
  doLast {
    def allowListedNames = allowList.collect { it.name }
    tasks.downloadLicenses.dependencyToLicenseJson().dependencies
      .findAll { dep -> !dep.name.matches(excludeNeo4jPattern) }
      .findAll { dep -> allowListedNames.intersect(dep.licenses.collect { it.name }).isEmpty() }
      .each { dep -> logger.error("In project ${project.name}: Could not find an allowed license for dependency '$dep.name'. Details: ${dep.toMapString()}") }
      .each { dep -> throw new GradleException("The dependency '$dep.name' has no allowed license") }
  }
}
tasks.check.dependsOn tasks.validateLicenses

// Renders the contents of LICENSES.txt and NOTICE.txt from the downloadLicenses report, keyed by file name.
def renderLicensesFiles = {
  ->
  def licenseGroups = tasks.downloadLicenses.licenseToDependencyJson().licences.sort { it.name }

  def licensesText = new StringBuilder(rootProject.file("$publicDir/licenses/headers/LICENSES-header.txt").text)
  licenseGroups.findAll { lic ->
    allowList.any {
      lic.name == it.name
    }
  }.each {
    licensesText << '\n\n'
    licensesText << "------------------------------------------------------------------------------\n"
    licensesText << "$it.name\n"
    it.dependencies.sort { it }.each { licensesText << "  $it\n" }
    licensesText << "------------------------------------------------------------------------------\n"
    licensesText << '\n'
    licensesText << rootProject.file("$project.rootDir/licenses/text/$it.name").text
  }

  def noticeText = new StringBuilder(rootProject.file("$publicDir/licenses/headers/NOTICE-header.txt").text)
  noticeText << '\n\n'
  noticeText << "Third-party licenses\n"
  noticeText << "--------------------\n"
  licenseGroups.each {
    noticeText << '\n'
    noticeText << "$it.name\n"
    it.dependencies.sort { it }.each { noticeText << "  $it\n" }
  }

  ['LICENSES.txt': licensesText.toString(), 'NOTICE.txt': noticeText.toString()]
}

tasks.register("generateLicensesFiles") {
  group = 'license'
  description = 'Generates a LICENSES and NOTICE file with 3rd-party dependency license information'

  dependsOn tasks.downloadLicenses, tasks.validateLicenses

  doLast {
    renderLicensesFiles().each { name, text -> file("$project.rootDir/$name").text = text }
  }
}

tasks.register("verifyLicensesFiles") {
  group = 'license'
  description = 'Fails if LICENSES.txt or NOTICE.txt are out of date with the 3rd-party dependencies'

  dependsOn tasks.downloadLicenses

  doLast {
    def stale = renderLicensesFiles().findAll { name, text ->
      def stored = file("$project.rootDir/$name")
      !stored.exists() || stored.readLines() != text.readLines()
    }.keySet()

    if (stale) {
      throw new GradleException("${stale.join(' and ')} ${stale.size() == 1 ? 'is' : 'are'} out of date with the project's dependencies. " +
      "Run `./gradlew generateLicensesFiles` and commit the result.")
    }
  }
}

tasks.check.dependsOn tasks.verifyLicensesFiles
