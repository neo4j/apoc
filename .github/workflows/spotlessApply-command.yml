name: Formats PR
on:
  repository_dispatch:
    types: [spotlessApply-command]

permissions: {}

jobs:
  build:
    # Untrusted: runs the fork PR's own gradlew/build scripts. Must never
    # receive secrets or elevated GITHUB_TOKEN permissions.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modified: ${{ steps.build.outputs.modified }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - id: build
        name: Build (untrusted fork code, no secrets)
        uses: ./.github/actions/gradle-command-build
        with:
          gradle-command: spotlessApply

  push:
    needs: build
    # Trusted: never executes code from the fork checkout, only applies the
    # diff produced by the build job and pushes it with the service account.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - name: Apply diff and push to PR (trusted)
        uses: ./.github/actions/gradle-command-push
        with:
          gradle-command: spotlessApply
          modified: ${{ needs.build.outputs.modified }}
          SERVICE_ACCOUNT_PAT: ${{ secrets.SERVICE_ACCOUNT_PAT }}
