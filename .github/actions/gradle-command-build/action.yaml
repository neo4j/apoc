name: "Build gradle command on PR (untrusted)"
description: >
  Checks out the exact PR head commit (which may be an attacker-controlled fork)
  and runs a gradle command against it. This action MUST NEVER be given secrets
  and the calling job MUST NOT declare any privileged permissions or secrets,
  since the checked-out code (gradlew, build scripts, settings.gradle) is
  fully attacker-controlled. Any resulting file changes are produced as a
  patch artifact for a separate, trusted job to apply and push.

inputs:
  gradle-command:
    description: "Gradle command to run"
    required: true

outputs:
  modified:
    description: "Whether the gradle command produced file changes"
    value: ${{ steps.git-check.outputs.modified }}

runs:
  using: "composite"
  steps:
    - name: Checkout PR head commit (fork, untrusted)
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      with:
        persist-credentials: false
        repository: ${{ github.event.client_payload.pull_request.head.repo.full_name }}
        ref: ${{ github.event.client_payload.pull_request.head.sha }}

    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: "21"

    - name: Cache Gradle
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Run gradle command
      env:
        GRADLE_COMMAND: ${{ inputs.gradle-command }}
      shell: bash
      run: ./gradlew "$GRADLE_COMMAND" || true

    - name: Produce diff patch
      id: git-check
      shell: bash
      run: |
        git update-index --refresh || true
        if git diff-index --quiet HEAD --; then
          echo "modified=false" >> "$GITHUB_OUTPUT"
        else
          echo "modified=true" >> "$GITHUB_OUTPUT"
          git diff > "$RUNNER_TEMP/gradle-command.patch"
        fi

    - name: Upload patch artifact
      if: steps.git-check.outputs.modified == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: gradle-command-patch
        path: ${{ runner.temp }}/gradle-command.patch
        retention-days: 1
