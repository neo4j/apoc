name: "Push gradle command result to PR (trusted)"
description: >
  Applies a patch produced by the untrusted build job to the exact PR head
  commit that was reviewed when the slash command was issued, then pushes it
  using the privileged service account token. This action MUST NEVER execute
  code from the PR head (no gradlew, no local actions resolved from the PR
  checkout) since it runs with access to SERVICE_ACCOUNT_PAT.

inputs:
  gradle-command:
    description: "Gradle command that was run"
    required: true
  modified:
    description: "Whether the build job produced file changes ('true'/'false')"
    required: true
  SERVICE_ACCOUNT_PAT:
    required: true

runs:
  using: "composite"
  steps:
    - name: Verify PR branch has not moved since the command was issued
      if: inputs.modified == 'true'
      shell: bash
      env:
        EXPECTED_SHA: ${{ github.event.client_payload.pull_request.head.sha }}
        HEAD_REPO: ${{ github.event.client_payload.pull_request.head.repo.full_name }}
        HEAD_REF: ${{ github.event.client_payload.pull_request.head.ref }}
      run: |
        CURRENT_SHA=$(git ls-remote "https://github.com/${HEAD_REPO}.git" "refs/heads/${HEAD_REF}" | cut -f1)
        if [ -z "$CURRENT_SHA" ] || [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
          echo "::error::PR branch $HEAD_REPO@$HEAD_REF changed since the command was issued (expected $EXPECTED_SHA, found ${CURRENT_SHA:-<missing>}). Refusing to push; re-run the command against the current commit."
          exit 1
        fi

    - name: Checkout PR head commit
      if: inputs.modified == 'true'
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      with:
        persist-credentials: false
        repository: ${{ github.event.client_payload.pull_request.head.repo.full_name }}
        ref: ${{ github.event.client_payload.pull_request.head.sha }}

    - name: Download patch artifact
      if: inputs.modified == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: gradle-command-patch
        path: ${{ runner.temp }}

    - name: Apply patch and commit
      if: inputs.modified == 'true'
      env:
        GRADLE_COMMAND: ${{ inputs.gradle-command }}
      shell: bash
      run: |
        git apply --whitespace=fix "$RUNNER_TEMP/gradle-command.patch"
        git config --global user.name 'neo-technology-build-agent'
        git config --global user.email 'neo-technology-build-agent@users.noreply.github.com'
        git add -A
        git commit -m "[NOID] Run $GRADLE_COMMAND"

    - name: Push changes
      if: inputs.modified == 'true'
      uses: ad-m/github-push-action@d91a481090679876dfc4178fef17f286781251df # v0.8.0
      with:
        github_token: ${{ inputs.SERVICE_ACCOUNT_PAT }}
        repository: ${{ github.event.client_payload.pull_request.head.repo.full_name }}
        branch: ${{ github.event.client_payload.pull_request.head.ref }}

    - name: Add reaction on pushed changes
      if: ${{ success() && inputs.modified == 'true' }}
      uses: peter-evans/create-or-update-comment@67dcc547d311b736a8e6c5c236542148a47adc3d # v2
      with:
        token: ${{ inputs.SERVICE_ACCOUNT_PAT }}
        repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
        comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
        reaction-type: hooray

    - name: Add reaction when no update is needed
      if: ${{ success() && inputs.modified == 'false' }}
      uses: peter-evans/create-or-update-comment@67dcc547d311b736a8e6c5c236542148a47adc3d # v2
      with:
        token: ${{ inputs.SERVICE_ACCOUNT_PAT }}
        repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
        comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
        reaction-type: "+1"

    - name: Create URL to the run output for failure report
      shell: bash
      if: ${{ !success() }}
      id: vars
      run: echo run-url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID >> $GITHUB_OUTPUT

    - name: Create comment with URL on failure
      env:
        GRADLE_COMMAND: ${{ inputs.gradle-command }}
      if: ${{ !success() }}
      uses: peter-evans/create-or-update-comment@67dcc547d311b736a8e6c5c236542148a47adc3d # v2
      with:
        token: ${{ inputs.SERVICE_ACCOUNT_PAT }}
        repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
        issue-number: ${{ github.event.client_payload.github.payload.issue.number }}
        body: |
          :x: ["$GRADLE_COMMAND" failed][1]

          [1]: ${{ steps.vars.outputs.run-url }}

    - name: Report failure to original comment with a reaction
      if: ${{ !success() }}
      uses: peter-evans/create-or-update-comment@67dcc547d311b736a8e6c5c236542148a47adc3d # v2
      with:
        token: ${{ inputs.SERVICE_ACCOUNT_PAT }}
        repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
        comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
        reaction-type: "-1"
